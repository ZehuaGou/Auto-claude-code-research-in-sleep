# ARIS Research Default Workflow
# Defines the canonical sequence of research stages.
# External agents MUST route through tools/research_workflow.py.
# Do not manually invoke roles outside of this workflow.

stages:

  input_normalization:
    role: input_normalizer
    description: 用户输入规范化 — normalize raw user input into structured brief and candidate idea
    allowed_input_files:
      - research/current/raw_user_input.md
    forbidden_context:
      - old conclusions
      - previous experiment results
      - mock results
      - external_agent_direct
      - user preference shortcuts
      - unverified literature conclusions
      - generator trace
      - other candidates
    output_file: research/current/input_normalization.md
    require_validate: true

  research_contract:
    role: contract_reviewer
    description: 研究边界说明 — define what is in-scope, what is forbidden, success/failure criteria
    allowed_input_files:
      - research/current/input_normalization.md
    forbidden_context:
      - old conclusions
      - unverified experiment results
      - other candidates
      - user preference
      - generator trace
      - external_agent_direct output
      - mock/dry-run artifact
    output_file: research/current/trusted_outputs/research_contract.md
    require_validate: true

  literature_search:
    role: literature_scout
    description: 文献搜索与整理 — gather and normalize literature evidence for novelty checking
    allowed_input_files:
      - research/current/input_normalization.md
      - research/current/trusted_outputs/research_contract.md
      - research/current/literature_notes.md
      - literature/search_runs/current/top_k.md
    forbidden_context:
      - unverified search results as confirmed evidence
      - user preference shortcuts
      - external_agent_direct
      - old novelty conclusions
      - mock/dry-run artifact
      - paywalled_content_illegally_obtained
    output_file: research/current/trusted_outputs/literature_search.md
    require_validate: true
    stage_output_contract: |
      ROLE BOUNDARY — literature_search OUTPUT CONTRACT
      You are literature_scout. Your task is to gather, normalize, and summarize literature evidence.
      You MUST NOT perform novelty checking, novelty judgment, or claim whether the idea is novel.

      HARD CONSTRAINTS (violation = artifact rejected):
      1. Document title MUST be "Literature Search Evidence Summary" (not "Novelty Check Report" or similar).
      2. Do NOT use novelty judgment terms: "novel", "confirmed_novel", "potentially novel", "likely_incremental",
         "already_done", "no prior work", "this is novel", "novelty judgment", "novel framing".
      3. Do NOT use overlap-denial phrases: "Direct overlap: None", "absent from literature",
         "no existing work", "not found in literature" as conclusions.
      4. Allowed sections: Search Strategy, Evidence Table, Coverage Assessment, Open Questions, Limitations.
      5. You MUST NOT include sections: Novelty Conclusion, Novelty Verdict, Recommendation, Final Judgment.
      6. End the document with a boundary statement:
         "This artifact is literature evidence only. Novelty determination is performed by the novelty_checker stage."
      7. Preserve uncertainty: use "no evidence found in searched sources" instead of "does not exist".
      8. Do NOT include "Role: novelty_check" or any role marker for a different stage.
      9. Do NOT claim the idea is novel, incremental, or already done — that is novelty_checker's job.
      10. If coverage is insufficient, state what is missing; do NOT fill gaps with assumptions about novelty.

  novelty_check:
    role: novelty_checker
    description: 新颖性检查 — evidence-bounded novelty risk assessment (not final novelty proof)
    allow_insufficient_evidence_risk_assessment: true
    allowed_input_files:
      - research/current/input_normalization.md
      - research/current/trusted_outputs/research_contract.md
      - research/current/literature_notes.md
      - research/current/trusted_outputs/literature_search.md
      - literature/search_runs/current/top_k.md
      - docs/LITERATURE_REPAIR_QUEUE.md
    forbidden_context:
      - old novelty conclusions
      - unverified experiment results
      - other candidates
      - user preference
      - generator trace
      - previous optimistic summaries
      - external_agent_direct output
      - mock/dry-run artifact
    output_file: research/current/trusted_outputs/novelty_check.md
    require_validate: true
    stage_output_contract: |
      ROLE BOUNDARY — novelty_check OUTPUT CONTRACT
      You are novelty_checker. Your task is an evidence-bounded novelty risk assessment.
      This is NOT a final novelty proof. This is NOT a publication decision.

      HARD CONSTRAINTS (violation = artifact rejected):
      1. Document title MUST be "Novelty Check — Evidence-Bounded Risk Assessment".
      2. Do NOT use forbidden phrases as conclusions:
         - "confirmed novel", "no prior work", "direct overlap none", "no direct overlap found"
         - "definitely novel", "publishable novelty", "novelty proven"
         - "potentially novel", "likely novel"
      3. You MAY use these phrases only inside a "forbidden phrases / not allowed" explanation section.
      4. Allowed verdict labels ONLY:
         - high_risk_overlap
         - medium_risk_overlap
         - low_confidence_possible_gap
         - insufficient_evidence
      5. Required sections:
         - Scope and Evidence Boundary
         - Closest Prior Work and Overlap Risks
         - Risk Labels
         - Evidence-Bounded Assessment
         - Required Repairs Before Stronger Claim
         - Allowed Next Stage Recommendation
      6. Scope and Evidence Boundary MUST state:
         - This is not a final novelty proof.
         - OpenAlex only.
         - Metadata/abstract only.
         - No full text verified.
         - No arXiv/Crossref/Semantic Scholar.
         - No experiments.
      7. Closest Prior Work section MUST:
         - List each closest work with apparent relation, risk type, evidence limitation.
         - Use "No explicit trajectory-level formulation was visible in the retrieved abstracts."
         - NEVER use "no direct overlap found" or "direct overlap none" as conclusions.
         - Always qualify: "This does not establish absence of direct overlap."
      8. Risk Labels section MUST assign labels to dimensions:
         - internal-state hallucination detection
         - token-level detection
         - trajectory-level anomaly framing
         - unsupervised/real-time detection
         - black-box alternatives
      9. Evidence-Bounded Assessment MUST conclude with:
         - internal-state hallucination detection: medium_risk_overlap
         - trajectory-level anomaly framing: low_confidence_possible_gap
         - overall novelty confidence: insufficient_evidence
      10. Allowed Next Stage Recommendation MUST be one of:
          - continue_to_method_refinement_only
          - continue_to_experiment_plan_with_high_caution
          - do_not_continue
          Do NOT recommend paper writing.
      11. End the document with a boundary statement:
          "This artifact is an evidence-bounded risk assessment, not a novelty proof.
           It must be re-evaluated when full-text evidence becomes available."
      12. Preserve uncertainty: use "no evidence found in searched sources" instead of "does not exist".

  experiment_plan:
    role: experiment_auditor
    description: 实验计划 — design the experiment before writing any code
    allowed_input_files:
      - research/current/input_normalization.md
      - research/current/trusted_outputs/research_contract.md
      - research/current/trusted_outputs/novelty_check.md
    forbidden_context:
      - unverified results
      - old optimistic summaries
      - implementation preference from external agent
      - mock/dry-run artifact
    output_file: research/current/trusted_outputs/experiment_plan.md
    require_validate: true

  implementation_plan:
    role: experiment_implementer
    description: 实现计划 — plan the code implementation after contract + novelty + experiment_plan are verified
    allowed_input_files:
      - research/current/trusted_outputs/research_contract.md
      - research/current/trusted_outputs/novelty_check.md
      - research/current/trusted_outputs/experiment_plan.md
    forbidden_context:
      - unverified results
      - old failure narratives
      - unrelated experiments
      - external_agent_direct output
      - mock/dry-run artifact
    output_file: research/current/trusted_outputs/implementation_plan.md
    require_validate: true

  result_judge:
    role: result_judge
    description: 结果判断 — judge whether experimental results support the research claim
    allowed_input_files:
      - research/current/input_normalization.md
      - research/current/trusted_outputs/research_contract.md
      - research/current/trusted_outputs/novelty_check.md
      - research/current/trusted_outputs/experiment_plan.md
      - research/current/trusted_outputs/implementation_plan.md
      - research/current/experiment_results.md
    forbidden_context:
      - old optimistic summaries
      - unverified results
      - cherry-picked metrics
      - external_agent_direct output
      - mock/dry-run artifact
      - paper writing claims
    output_file: research/current/trusted_outputs/result_judge.md
    require_validate: true

  paper_writing:
    role: paper_writer
    description: 论文写作 — draft paper only from verified research artifacts and judged results
    allowed_input_files:
      - research/current/input_normalization.md
      - research/current/trusted_outputs/research_contract.md
      - research/current/trusted_outputs/literature_search.md
      - research/current/trusted_outputs/novelty_check.md
      - research/current/trusted_outputs/experiment_plan.md
      - research/current/trusted_outputs/implementation_plan.md
      - research/current/trusted_outputs/result_judge.md
    forbidden_context:
      - unverified results
      - external_agent_direct output
      - unsupported paper claims
      - exaggerated contribution claims
      - cherry-picked metrics
      - mock/dry-run artifact
      - user pressure to publish
    output_file: research/current/trusted_outputs/paper_draft.md
    require_validate: true

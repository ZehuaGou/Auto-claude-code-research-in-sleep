# ARIS Research Default Workflow
# Defines the canonical sequence of research stages.
# External agents MUST route through tools/research_workflow.py.
# Do not manually invoke roles outside of this workflow.

stages:

  input_normalization:
    role: input_normalizer
    description: 用户输入规范化 — normalize raw user input into structured brief and candidate idea
    allowed_input_files:
      - research/current/raw_user_input.md
    forbidden_context:
      - old conclusions
      - previous experiment results
      - mock results
      - external_agent_direct
      - user preference shortcuts
      - unverified literature conclusions
      - generator trace
      - other candidates
    output_file: research/current/input_normalization.md
    require_validate: true

  research_contract:
    role: contract_reviewer
    description: 研究边界说明 — define what is in-scope, what is forbidden, success/failure criteria
    allowed_input_files:
      - research/current/input_normalization.md
    forbidden_context:
      - old conclusions
      - unverified experiment results
      - other candidates
      - user preference
      - generator trace
      - external_agent_direct output
      - mock/dry-run artifact
    output_file: research/current/trusted_outputs/research_contract.md
    require_validate: true

  literature_search:
    role: literature_scout
    description: 文献搜索与整理 — gather and normalize literature evidence for novelty checking
    allowed_input_files:
      - research/current/input_normalization.md
      - research/current/trusted_outputs/research_contract.md
      - research/current/literature_notes.md
      - literature/search_runs/current/top_k.md
    forbidden_context:
      - unverified search results as confirmed evidence
      - user preference shortcuts
      - external_agent_direct
      - old novelty conclusions
      - mock/dry-run artifact
      - paywalled_content_illegally_obtained
    output_file: research/current/trusted_outputs/literature_search.md
    require_validate: true
    stage_output_contract: |
      ROLE BOUNDARY — literature_search OUTPUT CONTRACT
      You are literature_scout. Your task is to gather, normalize, and summarize literature evidence.
      You MUST NOT perform novelty checking, novelty judgment, or claim whether the idea is novel.

      HARD CONSTRAINTS (violation = artifact rejected):
      1. Document title MUST be "Literature Search Evidence Summary" (not "Novelty Check Report" or similar).
      2. Do NOT use novelty judgment terms: "novel", "confirmed_novel", "potentially novel", "likely_incremental",
         "already_done", "no prior work", "this is novel", "novelty judgment", "novel framing".
      3. Do NOT use overlap-denial phrases: "Direct overlap: None", "absent from literature",
         "no existing work", "not found in literature" as conclusions.
      4. Allowed sections: Search Strategy, Evidence Table, Coverage Assessment, Open Questions, Limitations.
      5. You MUST NOT include sections: Novelty Conclusion, Novelty Verdict, Recommendation, Final Judgment.
      6. End the document with a boundary statement:
         "This artifact is literature evidence only. Novelty determination is performed by the novelty_checker stage."
      7. Preserve uncertainty: use "no evidence found in searched sources" instead of "does not exist".
      8. Do NOT include "Role: novelty_check" or any role marker for a different stage.
      9. Do NOT claim the idea is novel, incremental, or already done — that is novelty_checker's job.
      10. If coverage is insufficient, state what is missing; do NOT fill gaps with assumptions about novelty.

  novelty_check:
    role: novelty_checker
    description: 新颖性检查 — evidence-bounded novelty risk assessment (not final novelty proof)
    allow_insufficient_evidence_risk_assessment: true
    allowed_input_files:
      - research/current/input_normalization.md
      - research/current/trusted_outputs/research_contract.md
      - research/current/literature_notes.md
      - research/current/trusted_outputs/literature_search.md
      - literature/search_runs/current/top_k.md
      - docs/LITERATURE_REPAIR_QUEUE.md
    forbidden_context:
      - old novelty conclusions
      - unverified experiment results
      - other candidates
      - user preference
      - generator trace
      - previous optimistic summaries
      - external_agent_direct output
      - mock/dry-run artifact
    output_file: research/current/trusted_outputs/novelty_check.md
    require_validate: true
    stage_output_contract: |
      ROLE BOUNDARY — novelty_check OUTPUT CONTRACT
      You are novelty_checker. Your task is an evidence-bounded novelty risk assessment.
      This is NOT a final novelty proof. This is NOT a publication decision.

      HARD CONSTRAINTS (violation = artifact rejected):
      1. Document title MUST be "Novelty Check — Evidence-Bounded Risk Assessment".
      2. Do NOT use forbidden phrases as conclusions:
         - "confirmed novel", "no prior work", "direct overlap none", "no direct overlap found"
         - "definitely novel", "publishable novelty", "novelty proven"
         - "potentially novel", "likely novel"
      3. You MAY use these phrases only inside a "forbidden phrases / not allowed" explanation section.
      4. Allowed verdict labels ONLY:
         - high_risk_overlap
         - medium_risk_overlap
         - low_confidence_possible_gap
         - insufficient_evidence
      5. Required sections:
         - Scope and Evidence Boundary
         - Closest Prior Work and Overlap Risks
         - Risk Labels
         - Evidence-Bounded Assessment
         - Required Repairs Before Stronger Claim
         - Allowed Next Stage Recommendation
      6. Scope and Evidence Boundary MUST state:
         - This is not a final novelty proof.
         - OpenAlex only.
         - Metadata/abstract only.
         - No full text verified.
         - No arXiv/Crossref/Semantic Scholar.
         - No experiments.
      7. Closest Prior Work section MUST:
         - List each closest work with apparent relation, risk type, evidence limitation.
         - Use "No explicit trajectory-level formulation was visible in the retrieved abstracts."
         - NEVER use "no direct overlap found" or "direct overlap none" as conclusions.
         - Always qualify: "This does not establish absence of direct overlap."
      8. Risk Labels section MUST assign labels to dimensions:
         - internal-state hallucination detection
         - token-level detection
         - trajectory-level anomaly framing
         - unsupervised/real-time detection
         - black-box alternatives
      9. Evidence-Bounded Assessment MUST conclude with:
         - internal-state hallucination detection: medium_risk_overlap
         - trajectory-level anomaly framing: low_confidence_possible_gap
         - overall novelty confidence: insufficient_evidence
      10. Allowed Next Stage Recommendation MUST be one of:
          - continue_to_method_refinement_only
          - continue_to_experiment_plan_with_high_caution
          - do_not_continue
          Do NOT recommend paper writing.
      11. End the document with a boundary statement:
          "This artifact is an evidence-bounded risk assessment, not a novelty proof.
           It must be re-evaluated when full-text evidence becomes available."
      12. Preserve uncertainty: use "no evidence found in searched sources" instead of "does not exist".

  method_refinement:
    role: method_refiner
    description: 方法细化 — convert research idea into precise method specification before experiment planning
    allow_insufficient_evidence_risk_assessment: true
    allowed_input_files:
      - research/current/input_normalization.md
      - research/current/trusted_outputs/research_contract.md
      - research/current/literature_notes.md
      - research/current/trusted_outputs/literature_search.md
      - research/current/trusted_outputs/novelty_check.md
      - literature/search_runs/current/top_k.md
      - docs/LITERATURE_REPAIR_QUEUE.md
    forbidden_context:
      - old conclusions
      - old experimental results
      - unverified novelty conclusions
      - mock/dry-run artifact
      - external_agent_direct output
      - user preference shortcuts
      - implementation code
      - paper draft
      - experiment outputs
      - prior optimistic summaries
      - generator trace
    output_file: research/current/trusted_outputs/method_refinement.md
    require_validate: true
    stage_output_contract: |
      ROLE BOUNDARY — method_refinement OUTPUT CONTRACT
      You are method_refiner. Your task is to convert the research idea and evidence-bounded novelty
      risk assessment into a precise method specification. This is NOT an experiment plan.
      This is NOT a novelty proof. This is NOT a paper claim.

      HARD CONSTRAINTS (violation = artifact rejected):
      1. Document title MUST be "# Method Refinement — Generic Method Specification".
      2. Do NOT use forbidden phrases as conclusions:
         - "confirmed novel", "no prior work", "direct overlap none", "no direct overlap found"
         - "definitely novel", "publishable novelty", "novelty proven"
         - "this is novel", "proven novelty"
      3. Do NOT recommend paper writing as the next action.
      4. Required sections (all 12 must be present):
         - Scope and Evidence Boundary
         - Research Idea Under Refinement
         - Method Object Definition
         - Inputs and Outputs
         - Proposed Mechanism
         - Differentiator From Closest Prior Work
         - Testable Hypotheses
         - Non-Claims and Claim Boundaries
         - Minimum Experiment Boundary
         - Risks and Open Questions
         - Readiness Gate for experiment_plan
         - Next Allowed Action
      5. Scope and Evidence Boundary MUST state:
         - This is not an experiment plan.
         - This is not a novelty proof.
         - This is not a paper claim.
         - It uses current trusted artifacts and evidence-bounded novelty_check only.
         - Current evidence limitations remain active.
      6. Research Idea Under Refinement: restate the idea from current artifacts without expanding claims.
      7. Differentiator From Closest Prior Work section MUST:
         - Use "proposed differentiator" or "apparent differentiator" — never "confirmed novel".
         - Never say "no direct overlap found" or "direct overlap none" as conclusions.
         - Compare against closest work from literature_search / novelty_check.
         - Always qualify differentiator as apparent, not confirmed.
      8. Non-Claims and Claim Boundaries section MUST include:
         - No final novelty proof.
         - No full-text verification.
         - No claim of superiority.
         - No claim of general solution.
         - No claim that prior work lacks this idea.
      9. Readiness Gate for experiment_plan MUST be one of:
         - ready_for_experiment_plan_with_caution
         - needs_method_revision
         - needs_more_literature_evidence
         - blocked
         Must justify the label based on current evidence and method definition quality.
      10. Next Allowed Action MUST be one of:
          - continue_to_experiment_plan_with_caution
          - revise_method_refinement
          - collect_more_literature
          - stop
          Do NOT recommend paper writing.
      11. End the document with a boundary statement:
          "This artifact is a method specification only. It is not an experiment plan,
           a novelty proof, or a paper claim. Do not advance to experiment_plan without
           meeting the readiness gate criteria above."

  full_text_review:
    role: full_text_reviewer
    description: 全文审查 — review locally acquired open-access full-text materials for closest prior works
    allow_insufficient_evidence_risk_assessment: true
    allowed_input_files:
      - literature/full_text_store/current/manifest.json
      - literature/full_text_store/current/full_text_queue.json
      - literature/full_text_store/current/review_notes.md
      - literature/search_runs/current/top_k.md
      - research/current/trusted_outputs/method_refinement.md
      - literature/full_text_store/current/extracted_text/ftq_002.txt
      - literature/full_text_store/current/extracted_text/ftq_004.txt
      - literature/full_text_store/current/extracted_text/ftq_008.txt
      - literature/full_text_store/current/extracted_text/ftq_010.txt
    forbidden_context:
      - old novelty conclusions
      - unverified experiment results
      - mock/dry-run artifact
      - external_agent_direct output
      - user preference shortcuts
      - paper draft
      - paywalled_content_illegally_obtained
      - metadata_pages_treated_as_full_text
    output_file: research/current/trusted_outputs/full_text_review.md
    require_validate: true
    stage_output_contract: |
      ROLE BOUNDARY — full_text_review OUTPUT CONTRACT
      You are full_text_reviewer. Your task is to review locally acquired open-access full-text
      materials for the closest prior works. This is NOT a novelty proof.
      This is NOT an experiment plan. This is NOT a paper claim.

      HARD CONSTRAINTS (violation = artifact rejected):
      1. Document title MUST be "# Full Text Review — Closest Prior Work Evidence Check".
      2. Do NOT use forbidden phrases as conclusions:
         - "confirmed novel", "no prior work", "direct overlap none", "no direct overlap found"
         - "definitely novel", "publishable novelty", "novelty proven"
      3. Allowed verdict labels ONLY:
         - high_risk_overlap
         - medium_risk_overlap
         - low_confidence_possible_gap
         - insufficient_evidence
      4. Required sections:
         - Scope and Evidence Boundary
         - Reviewable Papers
         - Non-reviewable Papers
         - Per-Paper Method Review
         - Cross-Paper Overlap Assessment
         - Implications for Current Research Idea
         - Remaining Evidence Gaps
         - Readiness for Rerunning Trusted Stages
         - Next Allowed Action
      5. Scope and Evidence Boundary MUST state:
         - This is not a novelty proof.
         - This is not an experiment plan.
         - This is not a paper claim.
         - It reviews only currently acquired open-access/local materials.
         - Metadata-only and landing-page-only items are not treated as full text.
         - No paywalled text was used.
      6. Reviewable Papers section MUST list each reviewable paper with:
         - queue_id, title, full_text_status, source type
         - local extracted material status
         - reviewed yes/no/partial
      7. Non-reviewable Papers section MUST list metadata_page_only / landing_page_only papers
         and explain why they are not reviewable.
      8. Per-Paper Method Review section MUST answer for each reviewable paper:
         - Does it use hidden states? yes/no/unclear
         - Does it use token-level sequence? yes/no/unclear
         - Does it use trajectory/dynamics? yes/no/unclear
         - Does it use anomaly detection? yes/no/unclear
         - Does it use classifier/probe? yes/no/unclear
         - Does it define a reference distribution? yes/no/unclear
         - Does it handle variable-length generated outputs? yes/no/unclear
         - What is the closest overlap risk? high/medium/low/unclear
         - What evidence supports this? Use paraphrase and section pointers, not long quotes.
      9. Cross-Paper Overlap Assessment section MUST use ONLY allowed labels:
         - high_risk_overlap, medium_risk_overlap, low_confidence_possible_gap, insufficient_evidence
         Do NOT use: confirmed novel, no prior work, direct overlap none, definitely novel.
      10. Implications for Current Research Idea section MUST:
          - Explain what parts are already covered by prior work
          - Explain what remains unclear
          - Explain what needs more review
          - Explain whether trajectory-anomaly framing remains distinguishable or high-risk
          Do NOT claim novelty.
      11. Remaining Evidence Gaps section MUST include:
          - metadata-only papers still need true full text
          - PDF tool missing for ftq_008 if not extracted
          - Semantic Scholar deferred
          - human validation still needed if review is model-assisted
      12. Readiness for Rerunning Trusted Stages MUST be one of:
          - ready_to_rerun_literature_and_novelty
          - needs_more_full_text_acquisition
          - needs_manual_review
          - blocked
      13. Next Allowed Action MUST be one of:
          - rerun_literature_search_novelty_check_method_refinement
          - collect_more_full_text
          - manual_review_required
          - stop
          Do NOT recommend experiment_plan directly.
      14. End the document with a boundary statement:
          "This artifact is a full-text review of locally acquired materials only.
           It is not a novelty proof, an experiment plan, or a paper claim.
           Do not advance to experiment_plan without meeting the readiness gate criteria above."

  idea_pivot:
    role: idea_pivoter
    description: 想法转向 — evidence-grounded pivot to alternative research direction when current idea is blocked
    allow_insufficient_evidence_risk_assessment: true
    allowed_input_files:
      - research/current/input_normalization.md
      - research/current/trusted_outputs/research_contract.md
      - research/current/literature_notes.md
      - research/current/trusted_outputs/literature_search.md
      - research/current/trusted_outputs/novelty_check.md
      - research/current/trusted_outputs/method_refinement.md
      - research/current/trusted_outputs/full_text_review.md
      - literature/search_runs/current/top_k.md
      - literature/full_text_store/current/manifest.json
      - literature/full_text_store/current/full_text_queue.json
      - literature/full_text_store/current/review_notes.md
      - docs/LITERATURE_REPAIR_QUEUE.md
    forbidden_context:
      - old conclusions
      - old experimental results
      - unverified novelty conclusions
      - mock/dry-run artifact
      - external_agent_direct output
      - user preference shortcuts
      - implementation code
      - paper draft
      - experiment outputs
      - prior optimistic summaries
      - generator trace
    output_file: research/current/trusted_outputs/idea_pivot.md
    require_validate: true
    stage_output_contract: |
      ROLE BOUNDARY — idea_pivot OUTPUT CONTRACT
      You are idea_pivoter. Your task is to propose 5-10 evidence-grounded alternative research
      directions when the current idea is blocked. This is NOT a novelty proof.
      This is NOT an experiment plan. This is NOT a paper claim.

      HARD CONSTRAINTS (violation = artifact rejected):
      1. Document title MUST be "# Idea Pivot — Evidence-Grounded Alternative Directions".
      2. Do NOT use forbidden phrases as conclusions:
         - "confirmed novel", "no prior work", "direct overlap none"
         - "definitely novel", "publishable novelty", "novelty proven"
      3. Do NOT recommend paper writing as the next action.
      4. Do NOT use "ready_for_experiment_plan" or claim the pivot is ready for experiment_plan.
      5. Required sections:
         - Why the Current Idea Is Blocked
         - Evidence-Grounded Pivot Rationale
         - Proposed Alternative Directions (5-10 pivots)
         - Ranking and Selection Guidance
         - Next Allowed Action
      6. Why the Current Idea Is Blocked MUST:
         - Reference the specific blocker (e.g., high_risk_overlap, needs_more_literature_evidence)
         - Explain what evidence caused the block
         - Be grounded in actual artifacts, not hypotheticals
      7. Evidence-Grounded Pivot Rationale MUST:
         - Use evidence from literature_search, novelty_check, full_text_review, and/or review_notes
         - Explain what gaps or opportunities the pivots exploit
         - NOT be random new ideas — must be derived from evidence
      8. Proposed Alternative Directions MUST contain 5-10 pivots, each with ALL of:
         a. core_idea: Clear, specific research idea (not a vague topic)
         b. evidence_basis: Which specific evidence/literature gaps support this pivot
         c. collision_point_avoided: What specific overlap/block does this pivot avoid
         d. difference_from_closest_prior_work: How it differs from the nearest existing work
         e. difference_from_current_blocked_idea: How it differs from the blocked idea
         f. risk_level: high / medium / low (based on overlap risk and evidence availability)
         g. feasibility: assessment of practical feasibility (data, compute, expertise)
         h. minimal_experiment_boundary: smallest experiment that would validate the idea
         i. required_literature_follow_up: what additional literature search is needed
         j. worth_new_research_contract: yes / no — whether this warrants a new research_contract
      9. Ranking and Selection Guidance MUST:
         - Rank pivots by combined score of (evidence strength, low collision, feasibility)
         - Identify top 1-2 recommended pivots with justification
         - Note which pivots are high-risk but potentially high-reward
      10. Next Allowed Action MUST be one of:
          - restart_with_pivoted_idea
          - stop
          Do NOT recommend experiment_plan or paper_writing.
      11. End the document with a boundary statement:
          "This artifact proposes evidence-grounded alternative directions.
           It is not a novelty proof, an experiment plan, or a paper claim.
           To proceed, select a pivot and feed it into a new workflow run."

  experiment_plan:
    role: experiment_auditor
    description: 实验计划 — design the experiment before writing any code
    allowed_input_files:
      - research/current/input_normalization.md
      - research/current/trusted_outputs/research_contract.md
      - research/current/trusted_outputs/novelty_check.md
    forbidden_context:
      - unverified results
      - old optimistic summaries
      - implementation preference from external agent
      - mock/dry-run artifact
    output_file: research/current/trusted_outputs/experiment_plan.md
    require_validate: true

  implementation_plan:
    role: experiment_implementer
    description: 实现计划 — plan the code implementation after contract + novelty + experiment_plan are verified
    allowed_input_files:
      - research/current/trusted_outputs/research_contract.md
      - research/current/trusted_outputs/novelty_check.md
      - research/current/trusted_outputs/experiment_plan.md
    forbidden_context:
      - unverified results
      - old failure narratives
      - unrelated experiments
      - external_agent_direct output
      - mock/dry-run artifact
    output_file: research/current/trusted_outputs/implementation_plan.md
    require_validate: true

  result_judge:
    role: result_judge
    description: 结果判断 — judge whether experimental results support the research claim
    allowed_input_files:
      - research/current/input_normalization.md
      - research/current/trusted_outputs/research_contract.md
      - research/current/trusted_outputs/novelty_check.md
      - research/current/trusted_outputs/experiment_plan.md
      - research/current/trusted_outputs/implementation_plan.md
      - research/current/experiment_results.md
    forbidden_context:
      - old optimistic summaries
      - unverified results
      - cherry-picked metrics
      - external_agent_direct output
      - mock/dry-run artifact
      - paper writing claims
    output_file: research/current/trusted_outputs/result_judge.md
    require_validate: true

  paper_writing:
    role: paper_writer
    description: 论文写作 — draft paper only from verified research artifacts and judged results
    allowed_input_files:
      - research/current/input_normalization.md
      - research/current/trusted_outputs/research_contract.md
      - research/current/trusted_outputs/literature_search.md
      - research/current/trusted_outputs/novelty_check.md
      - research/current/trusted_outputs/experiment_plan.md
      - research/current/trusted_outputs/implementation_plan.md
      - research/current/trusted_outputs/result_judge.md
    forbidden_context:
      - unverified results
      - external_agent_direct output
      - unsupported paper claims
      - exaggerated contribution claims
      - cherry-picked metrics
      - mock/dry-run artifact
      - user pressure to publish
    output_file: research/current/trusted_outputs/paper_draft.md
    require_validate: true
